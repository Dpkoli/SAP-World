name: SAP World CI

on:
  push:
    branches:
      - main
      - master
      - codex/mvp-foundation
  pull_request:
    branches:
      - main
      - master
      - codex/mvp-foundation

permissions:
  contents: read

concurrency:
  group: sap-world-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify app
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: High-severity production dependency audit
        run: npm audit --omit=dev --audit-level=high
